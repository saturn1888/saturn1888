name: ozhunt
description: A family scavenger hunt app — create and play treasure hunts!
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.4
  confetti: ^0.7.0
  google_fonts: ^6.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  audioplayers: ^6.0.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
