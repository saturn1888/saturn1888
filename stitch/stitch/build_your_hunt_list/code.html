<!DOCTYPE html>

<style>
        body {
            background-color: #000144;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(69, 242, 185, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 221, 122, 0.05) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='2' cy='2' r='1' fill='%23ffffff' fill-opacity='0.1'/%3E%3Ccircle cx='50' cy='15' r='0.5' fill='%23ffffff' fill-opacity='0.1'/%3E%3Ccircle cx='90' cy='45' r='1' fill='%23ffffff' fill-opacity='0.1'/%3E%3Ccircle cx='15' cy='85' r='0.8' fill='%23ffffff' fill-opacity='0.1'/%3E%3C/svg%3E");

            vertical-align: middle;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(14, 20, 118, 0.6) 0%, rgba(4, 8, 94, 0.8) 100%);
            backdrop-filter: blur(12px);

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="font-body text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-[#000144] dark:bg-[#000144] bg-gradient-to-b from-[#04085e] to-transparent shadow-[0_16px_32px_-12px_rgba(0,1,34,0.8)] z-50">
<div class="flex justify-between items-center px-6 py-4 w-full">
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity duration-300 text-[#45f2b9] dark:text-[#45f2b9]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Fredoka_One'] font-bold text-2xl tracking-wide text-[#45f2b9] dark:text-[#45f2b9]">Build Your Hunt</h1>
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity duration-300 text-[#45f2b9] dark:text-[#45f2b9]">
<span class="material-symbols-outlined">volume_up</span>
</button>
</div>
</header>
<main class="px-6 pt-8 max-w-2xl mx-auto space-y-8">
<!-- Section Header -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<h2 class="font-['Fredoka_One'] text-tertiary text-2xl tracking-tight">Treasure Chest</h2>
<span class="bg-surface-container-high px-3 py-1 rounded-full text-primary text-xs font-extrabold tracking-widest uppercase">2/10 ITEMS</span>
</div>
<p class="text-on-surface-variant text-sm font-semibold">Place items on the map for your adventurers to find.</p>
</div>
<!-- Item Cards List -->
<div class="space-y-4">
<!-- Item Card 1 -->
<div class="glass-card rounded-lg p-4 flex items-center gap-4 group transition-all duration-300 hover:scale-[1.02] border border-outline-variant/10">
<div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 shadow-lg ring-2 ring-primary/20">
<img alt="Golden Key" class="w-full h-full object-cover" data-alt="Macro photo of an ancient ornate golden key resting on dark weathered wood with soft magical sparkles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB78BshRh5dXBnGnavDSMaUyOcZ8LoxTHGugPD5oGN1IRhH-RZ1Cb_aohNv29Nem0lBn6-eeUx8uYVVNMBqHIjl6qoWDI6vPrTwv4NS4EhVseGY7AfMOzwI_JiCUKolJtVfDP9450O5_u6K9akNONzXUf2JNk1_P6oq9dDW0bOmt0L3SM1jb_o6k3X6eHAYwhKu-mzxWCvqsHo0Rb4kDBsGUM_sQbIouMO7U5kkCPDpCWElkDAhv8Rlh6JtylfJCm-9b5kYjtC_p5o"/>
</div>
<div class="flex-grow">
<h3 class="font-['Fredoka_One'] text-tertiary text-lg">Ancient Golden Key</h3>
<div class="flex items-center gap-1 text-on-surface-variant text-xs font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">location_on</span>
<span>3 Clues Set</span>
</div>
</div>
<div class="flex flex-col gap-2">
<button class="p-2 text-primary hover:bg-primary/10 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">edit</span>
</button>
<button class="p-2 text-error hover:bg-error/10 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Item Card 2 -->
<div class="glass-card rounded-lg p-4 flex items-center gap-4 group transition-all duration-300 hover:scale-[1.02] border border-outline-variant/10">
<div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 shadow-lg ring-2 ring-primary/20">
<img alt="Crystal Shard" class="w-full h-full object-cover" data-alt="Glowing blue crystal shard glowing intensely against a dark cosmic background with faint stardust" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBI1aMLU3w08s6SJxALXsrCjN-HxBwSm-jG44wPVui4ZMznXVYcaziui9FhwbM2zm4q3fw0LeoORUG0VQ75s2eRnQXfkJ7Cp6kq39QUO9cwzv5dxTGLbwHdfUUKoFGCXMPuDT2SvLLrUwDs12j7jFP1d4UPgz6LU-5qtdhm8CeAd-7PLnGyH_jSKYHceEBHae4Y3oecqK9DLD3_QFfxVERtUAv4_GTlrVk9y54loaIvRE6fRlsYlJzrwm3VQaMnBML-DWnlHpID274"/>
</div>
<div class="flex-grow">
<h3 class="font-['Fredoka_One'] text-tertiary text-lg">Celestial Shard</h3>
<div class="flex items-center gap-1 text-on-surface-variant text-xs font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">location_on</span>
<span>5 Clues Set</span>
</div>
</div>
<div class="flex flex-col gap-2">
<button class="p-2 text-primary hover:bg-primary/10 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">edit</span>
</button>
<button class="p-2 text-error hover:bg-error/10 rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<!-- Add Item Prompt (Visual interest) -->
<div class="border-2 border-dashed border-outline-variant/30 rounded-lg p-6 flex flex-col items-center justify-center text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-4xl mb-2">add_circle</span>
<p class="font-bold text-sm">Add another treasure...</p>
</div>
</div>
</main>
<!-- FAB -->
<div class="fixed bottom-32 right-6 z-[60]">
<button class="w-16 h-16 bg-[#45f2b9] text-[#000144] rounded-full shadow-[0_8px_32px_rgba(69,242,185,0.4)] flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-3xl font-bold" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-[#04085e]/90 backdrop-blur-xl rounded-t-[32px] shadow-[0_-16px_32px_rgba(0,1,34,0.5)] border-t border-[#131a83]/30">
<!-- Drafts Item (Active based on context of 'Build Your Hunt') -->
<button class="flex flex-col items-center justify-center bg-[#45f2b9] text-[#000144] rounded-full px-6 py-2 shadow-[0_0_20px_rgba(69,242,185,0.4)] active:translate-y-1 transition-all duration-150 hover:brightness-125 transition-all">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
<span class="font-['Plus_Jakarta_Sans'] font-extrabold text-[12px] uppercase tracking-widest">Drafts</span>
</button>
<!-- Wood Style Button / Launch Item -->
<button class="flex flex-col items-center justify-center text-[#ff7442] opacity-70 active:translate-y-1 transition-all duration-150 hover:brightness-125 transition-all">
<div class="bg-secondary-container p-3 rounded-xl mb-1 shadow-inner border-b-4 border-on-secondary-fixed-variant">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="rocket_launch">rocket_launch</span>
</div>
<span class="font-['Plus_Jakarta_Sans'] font-extrabold text-[12px] uppercase tracking-widest">Launch</span>
</button>
</nav>
</body></html>
